<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DAA Mastery | 100 Viva Q&A — Crystal Clear Typography</title>
    <!-- Modern font stack with enhanced legibility: Inter as primary, premium fallbacks -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="knowledgeTest.css">
    
</head>
<body>

<button class="back-button" onclick="history.back()">← BACK</button>

<h1>📖 DAA • Design & Analysis of Algorithms</h1>
<div class="sub">⚡ Crystal‑clear Viva Prep | 100 Expert Q&A</div>

<!-- Knowledge Test Panel — modern layout with legible fonts -->
<div class="knowledge-panel">
    <div class="knowledge-header">
        <h2>📚 Knowledge Test — 100 Viva Q&A</h2>
        <div class="badge-count" id="totalCounter">📋 0 / 100</div>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search by keyword — question, answer, complexity, concept ..." autocomplete="off">
    </div>
    <div id="qaContainer" class="qa-grid">
        <div class="status-msg">✨ Loading 100 in-depth DAA questions ...</div>
    </div>
    <div class="status-msg" id="filterStatus">✔️ Showing all 100 essential questions</div>
</div>

<footer>
    <span class="complexity-tag">🎓 DAA Mastery</span> — Asymptotic Notations, Sorting, Graphs, DP, Greedy, NP‑Completeness & more
</footer>

    <script src="knowledgeTest.js"></script>
</body>
</html>
